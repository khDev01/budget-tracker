<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <style>
    @font-face {
      font-family: 'Material Icons';
      font-style: normal;
      font-weight: 400;
      src: url(material.woff2) format('woff2');
    }

    .material-icons {
      font-family: 'Material Icons';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;

    }
  </style>
  <link rel="stylesheet"
  href="./materialize.min.css">
  <meta charset="utf-8" />
  <link rel="icon" href="./favicon.png">
  <title>Budget App</title>
  <!-- <link rel="stylesheet"
  href="./style.css" /> -->
  <script
  src="jquery-3.6.0.min.js"></script>
</head>

<body class="blue-grey darken-2 ">
  <form class="myForm"
  onsubmit="calculate(); return false;">
    <div class=" row">

      <div class="input-field col ">
        <input type="number"
        onkeyup="calculate()"
        value="0.01" step="any"
        id="multiplier"
        class="white-text" />
      </div>

      <div class="input-field col ">
        <input type="number"
        onkeyup="calculate()" value="35"
        step="any" id="lowerNumber"
        class=" orange-text" />
      </div>

      <div class="input-field col ">
        <input type="number"
        onkeyup="calculate()" value="40"
        step="any" id="higherNumber"
        class="lime-text" />
      </div>
      <div class="input-field col ">
        <input type="button"
        value="0.001"
        id="lowerNumberMultiplier"
        class="btn-flat teal orange-text"
        onclick="toggleLowMult(); calculate()">
      </div>
      <div class="input-field col ">
        <input type="button"
        value="0.001"
        id="higherNumberMultiplier"
        class="btn-flat teal lime-text"
        onclick="toggleHighMult(); calculate()">
      </div>
      <!-- <input type="submit"
      id="updateButton"
      class="btn-flat teal input-field col"
      value="Calculate">
      </input> -->
    </div>
  </form>
  <span id="roundedDownCalc"
  style="font-size: xx-large; font-weight: bold;">rounded
    diff
  </span>
  <!-- <span id="calcResult">result</span> -->
  <span id="lowValue"
  class="orange-text">low</span>
  <span id="highValue"
  class=" lime-text">high</span>
  <span id="percentageChange"
  class=" blue-text">%</span>
  <span id="gb">#</span>

  <div id="result"></div>
  <script type="text/javascript"
  src="materialize.min.js"></script>
  <script src="scripts.js"></script>
  <script>
    $(document).ready(function () {
      $('select').formSelect();
      calculate()
    });
  </script>






</body>

</html>
